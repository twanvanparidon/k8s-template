apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: dev # Overridden by CLUSTER_NAME in Taskfile.yml
servers: 1
agents: 0
image: rancher/k3s:v1.36.4-k3s1 # Flux 2.9 needs Kubernetes >= 1.33
registries:
  create:
    name: registry.localhost
    host: "127.0.0.1"
    hostPort: "5050" # Mac already uses port 5000
ports:
  # Traefik NodePort, see infrastructure/controllers/dev/traefik-values.yaml
  - port: 8080:30080
    nodeFilters: [server:0:direct]
options:
  k3d:
    disableLoadbalancer: true
  k3s:
    extraArgs:
      # Bundled add-ons
      - arg: --disable=traefik
        nodeFilters: [server:*]
      - arg: --disable=servicelb
        nodeFilters: [server:*]
      - arg: --disable=metrics-server
        nodeFilters: [server:*]
      - arg: --disable=local-storage
        nodeFilters: [server:*]
