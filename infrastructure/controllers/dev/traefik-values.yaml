apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  values:
    deployment:
      replicas: 1
    # No load balancer in k3d, k3d.yaml maps this node port to the host.
    # HTTP only: browsers treat *.localhost as a secure context.
    service:
      type: NodePort
    ports:
      web:
        nodePort: 30080
