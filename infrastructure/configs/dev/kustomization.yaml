apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/cluster-issuer.yaml
patches:
  - path: cluster-issuer-patch.yaml
    target:
      kind: ClusterIssuer
      name: letsencrypt
  - target:
      kind: ClusterIssuer
      name: letsencrypt
    patch: |-
      - op: remove
        path: /spec/acme/email