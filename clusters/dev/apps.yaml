apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nginx-test
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 30m0s
  path: ./apps/dev/
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: OCIRepository
    name: manifests
  targetNamespace: default
  timeout: 3m0s
  wait: true
