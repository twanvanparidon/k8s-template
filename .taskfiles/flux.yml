version: '3'

silent: true

tasks:
  verify:
    desc: Print the Flux state as a machine readable status code.
    cmds:
      - |
        if ! flux check > /dev/null 2>&1; then
          echo "ERR:CHECK_FAILED"
        else
          LINES=$(kubectl diff -f ./clusters/dev | wc -l | tr -d ' ')
          if [ "$LINES" -gt 0 ]; then
            echo "ERR:OUT_SYNC"
          else
            echo "OK:IN_SYNC"
          fi
        fi

  up:
    desc: Install Flux and apply the cluster config when needed.
    cmds:
      - |
        FLUX_STATUS=$(task flux:verify --silent 2>/dev/null) || true
        if [ "$FLUX_STATUS" = "ERR:CHECK_FAILED" ]; then
          task flux:install
          task flux:apply
        elif [ "$FLUX_STATUS" = "ERR:OUT_SYNC" ]; then
          task flux:apply
        else
          gum log --level info "Flux is installed and in sync"
        fi

  install:
    desc: Install the Flux controllers into the cluster.
    cmds:
      - '{{.RUN}} "Installing Flux" flux install'

  apply:
    desc: Apply the manifests in clusters/dev to the cluster.
    cmds:
      - '{{.RUN}} "Applying cluster config" kubectl apply -f ./clusters/dev'

  watch:
    desc: Run sync again whenever a manifest changes.
    watch: true
    # Always sync on change, sync itself skips when the artifact is unchanged
    method: none
    sources:
      - apps/**/*.yaml
      - clusters/**/*.yaml
      - infrastructure/**/*.yaml
    cmds:
      - '{{.ROOT_DIR}}/scripts/serial.sh flux-sync task flux:sync'

  sync:
    desc: Push this repo as an OCI artifact and reconcile Flux.
    vars:
      ARTIFACT: oci://localhost:5050/manifests:dev
      # Only the manifest folders go into the artifact (gitignore format)
      IGNORE: '/*,!/apps/,!/clusters/,!/infrastructure/'
    cmds:
      - |
        set -e
        if flux diff artifact {{.ARTIFACT}} --path=. --ignore-paths='{{.IGNORE}}' > /dev/null 2>&1; then
          gum log --level info "Manifests are already in sync with {{.ARTIFACT}}"
          exit 0
        fi
        {{.RUN}} "Pushing manifests artifact" \
          flux push artifact {{.ARTIFACT}} \
          --path=. \
          --ignore-paths='{{.IGNORE}}' \
          --source=local \
          --revision="$(git describe --always --dirty)"
        {{.RUN}} "Reconciling Flux" flux reconcile kustomization dev --with-source
