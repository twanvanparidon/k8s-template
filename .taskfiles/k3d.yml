version: '3'

silent: true

vars:
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "cluster"}}'
  CLUSTER_SERVER_SCALE: '{{.CLUSTER_SERVER_SCALE | default "1"}}'

tasks:
  verify:
    desc: Print the cluster state as a machine readable status code.
    cmds:
      - |
        CLUSTERS=$(k3d cluster list)
        if ! echo "$CLUSTERS" | grep -qE "^{{.CLUSTER_NAME}}[[:space:]]"; then
          echo "ERR:CLUSTER_NOT_CREATED"
        elif ! echo "$CLUSTERS" | grep -qE "^{{.CLUSTER_NAME}}[[:space:]]+{{.CLUSTER_SERVER_SCALE}}/{{.CLUSTER_SERVER_SCALE}}[[:space:]]"; then
          echo "ERR:CLUSTER_NOT_STARTED"
        else
          echo "OK:CLUSTER_READY"
        fi

  up:
    desc: Create or start the k3d cluster so it is running.
    cmds:
      - |
        CLUSTER_STATUS=$(task k3d:verify --silent)
        if [ "$CLUSTER_STATUS" = "ERR:CLUSTER_NOT_CREATED" ]; then
          task k3d:create
        elif [ "$CLUSTER_STATUS" = "ERR:CLUSTER_NOT_STARTED" ]; then
          task k3d:start
        else
          gum log --level info "Cluster {{.CLUSTER_NAME}} is already running"
        fi

  create:
    desc: Create a new k3d cluster from k3d.yaml.
    cmds:
      - '{{.RUN}} "Creating cluster {{.CLUSTER_NAME}}" k3d cluster create "{{.CLUSTER_NAME}}" --config k3d.yaml'

  start:
    desc: Start the stopped k3d cluster.
    cmds:
      - '{{.RUN}} "Starting cluster {{.CLUSTER_NAME}}" k3d cluster start "{{.CLUSTER_NAME}}"'

  stop:
    desc: Stop the k3d cluster without deleting it.
    cmds:
      - '{{.RUN}} "Stopping cluster {{.CLUSTER_NAME}}" k3d cluster stop "{{.CLUSTER_NAME}}"'

  destroy:
    desc: Delete the k3d cluster and all its data.
    prompt: This deletes cluster {{.CLUSTER_NAME}} and all its data, continue?
    cmds:
      - '{{.RUN}} "Deleting cluster {{.CLUSTER_NAME}}" k3d cluster delete "{{.CLUSTER_NAME}}"'
