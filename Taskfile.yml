version: '3'

silent: true

vars:
  RUN: '{{.ROOT_DIR}}/scripts/run.sh'

includes:
  k3d:
    taskfile: ./.taskfiles/k3d.yml
    dir: .
    vars:
      CLUSTER_NAME: "cluster-name"
  flux:
    taskfile: ./.taskfiles/flux.yml
    dir: .
  sops:
    taskfile: ./.taskfiles/sops.yml
    dir: .
  # From ci-runner pipelines/k8s/lint; CI runs the same tasks.
  k8s:lint:
    taskfile: ./.taskfiles/k8s-lint.yml
    dir: .
    vars:
      K8S_DIR: .

tasks:
  default:
    desc: Pick a task to run from an interactive menu.
    interactive: true
    cmds:
      - |
        TASK=$(task --list --silent | grep -v '^default$' | gum filter --placeholder "Pick a task...") || exit 0
        task "$TASK"

  lint:
    desc: Run the k8s:lint steps CI runs, with live output.
    cmds:
      - '{{.RUN}} "Rendering kustomizations" task k8s:lint:render'
      - '{{.RUN}} "Checking schemas" task k8s:lint:schema'
      - '{{.RUN}} "Linting manifests" task k8s:lint:kube-linter'

  cluster:init:
    desc: Create the cluster and bring Flux up to date with this repo.
    cmds:
      - task: k3d:up
      - task: flux:up
      - task: sops:secret
      - task: flux:sync
      - gum style --border rounded --border-foreground 2 --padding "0 2" --bold "Cluster is ready"
